# Deploy ms-fabric-platform-core's own Fabric items to Test (Azure DevOps).
#
# platform/ holds lh_platform_metadata (the md_* tables) and nb_seed_metadata (the seeder).
#
# THIS MUST DEPLOY BEFORE ANY WORKLOAD REPO. Every workload lakehouse carries OneLake shortcuts
# pointing at lh_platform_metadata, and every workload notebook reads the md_* tables through
# them. Deploy a workload first and its shortcuts resolve to nothing.
#
# This DOES seed, and the seed matters more here than anywhere else: it is what CREATES the md_*
# Delta tables. Every workload lakehouse carries OneLake shortcuts pointing at those tables, so
# without this run they would be created pointing at paths that do not exist yet.
#
# The seed resolves only what exists at this point — the six workspaces, lh_platform_metadata,
# the connections and the config. The other twelve items are not deployed yet, which is exactly
# what --allow-unresolved is for; each later deploy re-seeds and fills in its own items.
#
# This pipeline checks out platform-core twice: once as the calling repo (for platform/) and
# once as the template source. That is not a mistake — the template is written to expect two
# checkouts and the alias is what `- checkout: platform-core` resolves against.

trigger: none
pr: none

parameters:
  - name: platformCoreRef
    type: string
    default: refs/heads/main
    displayName: >
      Branch or tag of ms-fabric-platform-core to take the template and scripts from. Use
      refs/heads/<branch> to test changes before merging. Unlike the GitHub side this DOES pick
      up template changes too, because an ADO repository resource ref is resolved at compile time
      and can be a parameter.


resources:
  repositories:
    - repository: platform-core
      type: git
      name: <YOUR-ADO-PROJECT>/ms-fabric-platform-core
      ref: ${{ parameters.platformCoreRef }}

jobs:
  - template: pipelines/templates/deploy-fabric-item.yml@platform-core
    parameters:
      jobName: deploy_platform
      jobDisplayName: "Deploy platform metadata items"
      variableGroups: [fabric-cicd-common]
      workspaceId: $(FABRIC_PLATFORM_WORKSPACE_ID)
      environmentName: TEST
      platformWorkspaceId: $(FABRIC_PLATFORM_WORKSPACE_ID)
      repositoryDirectory: platform
      itemsInScope: "Lakehouse,Notebook"
