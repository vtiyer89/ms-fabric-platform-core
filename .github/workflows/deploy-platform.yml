name: Deploy platform items to Fabric Test

# ms-fabric-platform-core is now an item repo as well as a tooling repo: platform/ holds
# lh_platform_metadata (the md_* tables) and nb_seed_metadata (the seeder).
#
# THIS MUST DEPLOY BEFORE ANY WORKLOAD REPO. Every workload lakehouse carries OneLake shortcuts
# pointing at lh_platform_metadata, and every workload notebook reads the md_* tables through
# them. Deploy a workload first and its shortcuts resolve to nothing.
#
# This DOES seed, and the seed matters more here than anywhere else: it is what CREATES the md_*
# Delta tables. Every workload lakehouse carries OneLake shortcuts pointing at those tables, so
# without this run they would be created pointing at paths that do not exist yet.
#
# The seed resolves only what exists at this point — the six workspaces, lh_platform_metadata,
# the connections and the config. The other twelve items are not deployed yet, which is exactly
# what --allow-unresolved is for; each later deploy re-seeds and fills in its own items.
on:
  workflow_dispatch:
    inputs:
      platform-core-ref:
        description: >
          Branch or tag of ms-fabric-platform-core to take the deploy and seed SCRIPTS from.
          Use a feature branch to test script changes. NOTE the reusable workflow DEFINITION
          still comes from @main — `uses:` cannot be an expression in GitHub Actions — so a
          change to deploy-fabric-item.yml itself is not exercised by this.
        type: string
        default: main

jobs:
  deploy-platform:
    uses: vtiyer89/ms-fabric-platform-core/.github/workflows/deploy-fabric-item.yml@main
    with:
      workspace-id: ${{ vars.FABRIC_PLATFORM_WORKSPACE_ID }}
      environment-name: TEST
      platform-core-ref: ${{ inputs.platform-core-ref }}
      platform-workspace-id: ${{ vars.FABRIC_PLATFORM_WORKSPACE_ID }}
      repository-directory: platform
      items-in-scope: "Lakehouse,Notebook"
      # platform/ itself references no connections, so none of these are needed to DEPLOY it.
      # They are here for the SEED step that runs after: the seeder writes the whole
      # md_connection table for the environment, and platform-core is the only repo that can
      # supply all four — each item repo carries only its own, which is why their per-deploy
      # seeds write md_connection partially and warn about the rest.
      #
      # The reusable workflow exports these to $GITHUB_ENV, so the seed step picks them up.
      # Pass Variables, never Secrets: these values appear in workflow logs.
      parameter-env-vars: |
        FABRIC_PARAM_TEST_COPY_JOB_CONNECTION_ID=${{ vars.TEST_COPY_JOB_CONNECTION_ID }}
        FABRIC_PARAM_TEST_SILVER_CONNECTION_ID=${{ vars.TEST_SILVER_CONNECTION_ID }}
        FABRIC_PARAM_TEST_GOLD_CONNECTION_ID=${{ vars.TEST_GOLD_CONNECTION_ID }}
        FABRIC_PARAM_TEST_PIPELINE_INVOKE_CONNECTION_ID=${{ vars.TEST_PIPELINE_INVOKE_CONNECTION_ID }}
    secrets: inherit
