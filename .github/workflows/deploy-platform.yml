name: Deploy platform items to Fabric Test

# ms-fabric-platform-core is now an item repo as well as a tooling repo: platform/ holds
# lh_platform_metadata (the md_* tables) and nb_seed_metadata (the seeder).
#
# THIS MUST DEPLOY BEFORE ANY WORKLOAD REPO. Every workload lakehouse carries OneLake shortcuts
# pointing at lh_platform_metadata, and every workload notebook reads the md_* tables through
# them. Deploy a workload first and its shortcuts resolve to nothing.
#
# This DOES seed, and the seed matters more here than anywhere else: it is what CREATES the md_*
# Delta tables. Every workload lakehouse carries OneLake shortcuts pointing at those tables, so
# without this run they would be created pointing at paths that do not exist yet.
#
# The seed resolves only what exists at this point — the six workspaces, lh_platform_metadata,
# the connections and the config. The other twelve items are not deployed yet, which is exactly
# what --allow-unresolved is for; each later deploy re-seeds and fills in its own items.
on:
  workflow_dispatch: {}

jobs:
  deploy-platform:
    uses: vtiyer89/ms-fabric-platform-core/.github/workflows/deploy-fabric-item.yml@main
    with:
      workspace-id: ${{ vars.FABRIC_PLATFORM_WORKSPACE_ID }}
      environment-name: TEST
      platform-workspace-id: ${{ vars.FABRIC_PLATFORM_WORKSPACE_ID }}
      repository-directory: platform
      items-in-scope: "Lakehouse,Notebook"
    secrets: inherit
