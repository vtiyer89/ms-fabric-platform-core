name: Deploy Fabric Item (reusable)

# Shared deploy logic for all ms-fabric-* repos. Called via:
#   uses: vtiyer89/ms-fabric-platform-core/.github/workflows/deploy-fabric-item.yml@main
#
# Each caller repo supplies its own workspace/repository-directory/item-scope; this workflow
# checks out both the calling repo (to get its parameter.yml + item folders) and this repo
# (to get the shared deploy script), then runs fabric-cicd.
#
# One-time setup: in ms-fabric-platform-core, Settings -> Actions -> General -> Access,
# allow "Accessible from repositories in the 'vtiyer89' organization" so the other repos
# are permitted to call this workflow.

on:
  workflow_call:
    inputs:
      workspace-id:
        required: true
        type: string
      environment-name:
        required: true
        type: string
        description: "Must match a key in the caller repo's parameter.yml, e.g. TEST"
      repository-directory:
        required: true
        type: string
        description: "Path, relative to the caller repo's root, containing that workspace's items + parameter.yml"
      items-in-scope:
        required: true
        type: string
        description: "Comma-separated Fabric item types, e.g. Lakehouse,DataPipeline,Notebook"
      items-to-include:
        required: false
        type: string
        default: ""
        description: |
          Optional comma-separated "item_name.ItemType" list. When set, only these items are
          published, letting one repository-directory feed two workspaces (e.g. ingestion's
          landing and bronze). Every item in the directory must be covered by exactly one
          caller job, or the uncovered ones are never deployed.
      platform-core-ref:
        required: false
        type: string
        default: main
      parameter-env-vars:
        required: false
        type: string
        default: ""
        description: >
          Newline-separated FABRIC_PARAM_<NAME>=<value> pairs, exported before the deploy so
          parameter.yml can reference them as $ENV:<NAME>. Used for connection IDs, the only
          values fabric-cicd can't resolve live. Each caller supplies one line per variable,
          taking the value from a repo Variable. NOTE - do not put a GitHub expression in this
          description; Actions evaluates expressions here and 'vars' is not a valid context in
          the workflow_call block, which fails the whole workflow at parse time. Values appear
          in workflow logs, so pass Variables here, never Secrets.
    secrets:
      PLATFORM_CORE_TOKEN:
        required: false
        description: >
          Token with Contents-Read on ms-fabric-platform-core, used only to check this repo out
          onto the runner. Required while platform-core is PRIVATE - the default GITHUB_TOKEN is
          scoped to the calling repository and cannot read another private repo, which fails as
          "Repository not found". Not needed if platform-core is public. Callers using
          'secrets: inherit' pick this up automatically from an org secret.
      AZURE_CLIENT_ID:
        required: true
      AZURE_CLIENT_SECRET:
        required: true
      AZURE_TENANT_ID:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4
        with:
          path: item-repo

      - name: Checkout ms-fabric-platform-core (shared deploy script)
        uses: actions/checkout@v4
        with:
          repository: vtiyer89/ms-fabric-platform-core
          ref: ${{ inputs.platform-core-ref }}
          path: platform-core
          # Falls back to GITHUB_TOKEN, which only works if platform-core is public.
          token: ${{ secrets.PLATFORM_CORE_TOKEN || github.token }}

      - name: Confirm the shared script was checked out
        run: |
          if [ ! -f platform-core/scripts/deploy_fabric_item.py ]; then
            echo "[error] platform-core checked out but scripts/deploy_fabric_item.py is missing."
            echo "[error] Check the platform-core-ref input (currently '${{ inputs.platform-core-ref }}')."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r platform-core/scripts/requirements.txt

      # Always runs, even with nothing to export, so "no variables supplied" is visible in the
      # log rather than an invisible skipped step. The input goes through env: rather than being
      # interpolated into the script, so its contents can't be parsed as shell.
      - name: Export parameter.yml environment variables
        env:
          PARAMETER_ENV_VARS: ${{ inputs.parameter-env-vars }}
        run: |
          exported=0
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            echo "$line" >> "$GITHUB_ENV"
            echo "  exported ${line%%=*}"
            exported=$((exported + 1))
          done <<< "$PARAMETER_ENV_VARS"
          if [ "$exported" -eq 0 ]; then
            echo "No parameter.yml environment variables supplied by the caller."
            echo "If this repo's parameter.yml uses \$ENV: tokens, the deploy will stop at the"
            echo "next step naming the missing variables. Every job sharing a parameter.yml"
            echo "needs them, even jobs whose items-to-include don't use the value."
          else
            echo "Exported $exported variable(s) for parameter.yml."
          fi

      - run: |
          python platform-core/scripts/deploy_fabric_item.py \
            --workspace-id "${{ inputs.workspace-id }}" \
            --environment "${{ inputs.environment-name }}" \
            --repository-directory "item-repo/${{ inputs.repository-directory }}" \
            --items-in-scope "${{ inputs.items-in-scope }}" \
            --items-to-include "${{ inputs.items-to-include }}"
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
